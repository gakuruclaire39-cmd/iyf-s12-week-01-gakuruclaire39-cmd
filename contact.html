<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Claire Wairimu</title>
    <style>
    body { font-family: system-ui, sans-serif; max-width: 650px; margin: 2rem auto; padding: 1rem; line-height: 1.5; }
    fieldset { margin-bottom: 1.5rem; border: 1px solid #ccc; border-radius: 8px; padding: 1rem; }
    legend { font-weight: bold; padding: 0 0.5rem; }
    label { display: block; margin-top: 1rem; font-weight: 500; }
    input, select, textarea { width: 100%; padding: 0.6rem; margin-top: 0.3rem; border-radius: 6px;  border: 1px solid #999; }
    button { padding: 0.8rem 1.5rem; background: #111; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 1rem; }
    button:hover { background: #333; } 
    input[type="checkbox"] { width: auto !important;}
  </style>
</head>
<body>
    <header>
        <div class="logo">Claire Wairimu</div>
        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" class="active" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h1>Contact Me</h1>
            <p>Email: <a href="mailto:gakuruclaire39@gmail.com">gakuruclaire39@gmail.com</a></p>
            <p>Phone: +254 712 345 678</p>
            <p>Location: Nairobi, Kenya (EAT GMT+3)</p>
            <p>Connect: <a href="https://github.com/gakuruclaire39-cmd">GitHub</a></p>
        </section>

        <section>
            <h2>Send a Message</h2>
            <form method="post" action="#">
                <fieldset>
                    <legend>Personal Information</legend>
                    <label for="fullname">Full Name *</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>

                    <label for="phone">Phone (optional)</label>
                    <input type="tel" id="phone" name="phone" placeholder="+254 712 345 678">
                </fieldset>

                <fieldset>
                    <legend>Message Details</legend>
                    <label for="subject">Subject *</label>
                    <select id="subject" name="subject" required>
                        <option value="">-- Select Subject --</option>
                        <option value="collaboration">Collaboration</option>
                        <option value="inquiry">General Inquiry</option>
                        <option value="feedback">Feedback</option>
                    </select>

                    <label for="message">Message * (min 50 characters)</label>
                    <textarea id="message" name="message" placeholder="Write your message here..." required minlength="50" rows="5"></textarea>
                </fieldset>

                <fieldset>
                    <legend>Preferences</legend>
                    <label for="newsletter" style="display: flex; align-items: centre; gap: 8px>
                     <input type="checkbox" id="newsletter" name="newsletter" style="width: auto; margin: 0;>
                        Subscribe to newsletter
                    </label>
                </fieldset>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
    <footer><p>&copy; 2026 Claire Wairimu</p></footer>
</body>
</html>
