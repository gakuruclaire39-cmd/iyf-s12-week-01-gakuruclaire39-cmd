<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"content="width=device-width, initial-scale=1.0">
  <title>Contact Me</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 650px; margin: 2rem auto; padding: 1rem; line-height: 1.5; }
    fieldset { margin-bottom: 1.5rem; border: 1px solid #ccc; border-radius: 8px; padding: 1rem; }
    legend { font-weight: bold; padding: 0 0.5rem; }
    label { display: block; margin-top: 1rem; font-weight: 500; }
    input, select, textarea { width: 100%; padding: 0.6rem; margin-top: 0.3rem; border-radius: 6px;  border: 1px solid #999; }
    button { padding: 0.8rem 1.5rem; background: #111; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 1rem; }
    button:hover { background: #333; } 
  </style>
</head>
<body>
  <nav style="display:flex;gap:1rem;background:#f4f4f4;padding:0.8rem;border-radius:8px;flex-wrap:wrap;margin-bottom:1rem">
    <a href="index.html" style="text-decoration:none;color:#333;padding:0.3rem 0.6rem">Home</a>
    <a href="about.html" style="text-decoration:none;color:#333;padding:0.3rem 0.6rem">About</a>
    <a href="projects.html" style="text-decoration:none;color:#333;padding:0.3rem 0.6rem">Projects</a>
    <a href="contact.html" style="text-decoration:none;background:#111;color:#fff;padding:0.3rem 0.6rem;border-radius:4px">Contact</a>
  </nav>
    <h1>Contact Me</h1>
    <form action="#" method="posts"(so validation works)>

       <!-- Personal Info -->
       <fieldset>
         <legend>Personal Information</legend>

         <label for="fullName">Full Name *</label>
         <input type="text" id="fullName" name="fullName" placeholder="e.g. Ella Wanjiru" required autocomplete="name">

         <label for="email">Email Address *</label>
         <input type="email" id="email" name="email" placeholder="e.g. ella@gmail.com" required autocomplete="email">

         <label for="phone">Phone Number</label>
         <input type="tel" id="phone" name="phone" placeholder="e.g. +254 712 345 678" autocomplete="tel">  
       </fieldset>

       <!-- Message -->
       <fieldset>
         <legend>Your Message</legend>

         <label for="subject">Subject *</label>
         <select id="subject" name="subject" required>
           <option value=""disabled selected>Select a subject</option>
           <option value="general">General Inquiry</option>
           <option value="support">Customer Support</option>
           <option value="booking">Service Booking</option>
         </select>

         <label for="message">Message * (min 50 characters)</label>
         <textarea id="message" name="message" placeholder="Tell us how we can help you..." required minlength="50" rows='6'></textarea>

         <label for="newsletter" style="display: flex; gap: 0.5rem; align-items: center; margin-top: 1.2rem;">
           <input type="checkbox" id="newsletter" name="newsletter" style="width: auto;">
           Subscribe to our newsletter
         </label>
       </fieldest>

      <button type="submit">Send Message</button>
    </form>

  <hr>
<h2>Find Me</h2>

</body>
</html>
